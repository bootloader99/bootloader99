<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Hisham — mobile developer and independent builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#172b32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75e0c1"/>
      <stop offset="1" stop-color="#8ab4ff"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="230" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="230" rx="18" fill="url(#grid)"/>
  <circle cx="890" cy="36" r="125" fill="#75e0c1" opacity=".06"/>
  <circle cx="930" cy="205" r="100" fill="#8ab4ff" opacity=".06"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="58" y="58" fill="#9aafc2" font-size="14">~/about</text>
    <circle cx="916" cy="34" r="5" fill="#75e0c1"/>
    <text x="58" y="119" fill="#f1f6fb" font-size="43" font-weight="700">Hey, I'm Hisham.</text>
    <text x="60" y="158" fill="#b6c8d7" font-size="18">Mobile developer · Independent builder · Game dev</text>
    <text x="60" y="197" fill="#75e0c1" font-size="15">$ curious_by_default</text>
    <rect x="255" y="183" width="10" height="19" rx="1" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M58 215H942" stroke="url(#accent)" stroke-opacity=".55" stroke-width="2"/>
</svg>