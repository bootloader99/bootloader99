<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Hisham — curious engineer, building with intent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset=".58" stop-color="#142635"/>
      <stop offset="1" stop-color="#17352f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e2bf"/>
      <stop offset="1" stop-color="#91b5ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#72e2bf" stop-opacity=".22"/>
      <stop offset="1" stop-color="#72e2bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#dcecff" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <rect width="1000" height="270" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="270" rx="18" fill="url(#grid)"/>
  <circle cx="855" cy="90" r="190" fill="url(#glow)">
    <animate attributeName="opacity" values=".55;.95;.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".2">
    <circle cx="865" cy="112" r="88" stroke-dasharray="2 9"/>
    <circle cx="865" cy="112" r="116" stroke-dasharray="1 13">
      <animateTransform attributeName="transform" type="rotate" from="0 865 112" to="360 865 112" dur="55s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Android unlocks a phone: a small nod to the curiosity that started it all -->
  <!-- Phone -->
  <g>
    <rect x="900" y="64" width="48" height="91" rx="8" fill="#0a1723" stroke="#91b5ff" stroke-opacity=".8" stroke-width="2"/>
    <rect x="905" y="73" width="38" height="73" rx="4" fill="#142b38"/>
    <circle cx="924" cy="150" r="1.8" fill="#91b5ff"/>
    <g font-family="ui-monospace,monospace" font-size="6.5" fill="#91b5ff" opacity=".85">
      <text x="909" y="91">BOOTLOADER</text>
      <text x="909" y="102" fill="#72e2bf">LOCKED</text>
      <text x="909" y="115" fill="#72e2bf">_ _ _ _</text>
    </g>
    <g opacity=".0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.42;.5;.88;1" dur="5s" repeatCount="indefinite"/>
      <rect x="909" y="96" width="30" height="24" rx="3" fill="#72e2bf" fill-opacity=".12"/>
      <g font-family="ui-monospace,monospace" font-size="6.5" fill="#72e2bf">
        <text x="909" y="105">UNLOCKED</text>
        <text x="909" y="116">READY TO</text>
        <text x="909" y="125">EXPLORE</text>
      </g>
    </g>
    <!-- Lock body and shackle -->
    <rect x="914" y="35" width="20" height="19" rx="4" fill="#72e2bf"/>
    <path d="M918 37V30A6 6 0 0 1 930 30V37" fill="none" stroke="#72e2bf" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 924 37;0 924 37;-38 924 37;-38 924 37;0 924 37" keyTimes="0;.38;.48;.88;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="924" cy="44" r="2.2" fill="#10202a"/>
    <path d="M924 46V50" stroke="#10202a" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Android approaches the lock, reaches up to turn the key, then steps back -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;7 -2;7 -2;0 0" keyTimes="0;.2;.38;.8;1" dur="5s" repeatCount="indefinite"/>
    <g transform="translate(850 128)">
      <animateTransform attributeName="transform" type="translate" values="850 128;850 128;850 124;850 124;850 128" keyTimes="0;.2;.38;.8;1" dur="5s" repeatCount="indefinite"/>
      <path d="M-10 -20L-15 -28M10 -20L15 -28" fill="none" stroke="#72e2bf" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-17 -11A17 17 0 0 1 17 -11V-6H-17Z" fill="#72e2bf"/>
      <rect x="-17" y="-7" width="34" height="27" rx="6" fill="#72e2bf"/>
      <circle cx="-6" cy="-13" r="2" fill="#10202a"/>
      <circle cx="6" cy="-13" r="2" fill="#10202a"/>
      <path d="M-22 0L-27 12M18 -1L28 -23" fill="none" stroke="#72e2bf" stroke-width="4" stroke-linecap="round">
        <animate attributeName="d" values="M-22 0L-27 12M18 -1L28 -23;M-22 0L-27 12M18 -1L27 -31;M-22 0L-27 12M18 -1L28 -23" keyTimes="0;.4;.8" dur="5s" repeatCount="indefinite"/>
      </path>
      <path d="M-9 20V28M9 20V28" stroke="#72e2bf" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- A small key travels from Android's hand to the lock -->
  <g fill="none" stroke="#caffeb" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.28;.34;.48;.54" dur="5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="878 105;878 105;900 54;900 54;900 54" keyTimes="0;.28;.42;.48;1" dur="5s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="5"/>
      <path d="M5 0H19M15 0V4M19 0V4"/>
    </g>
  </g>
  <!-- Unlock confirmation pulse -->
  <circle cx="924" cy="109" r="4" fill="none" stroke="#72e2bf" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="4;22;4" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.8;0" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="54" fill="#9bb0c2" font-size="13" letter-spacing="2">A MINDSET, NOT A STACK</text>
    <text x="60" y="126" fill="#f4f7fb" font-size="51" font-weight="700" letter-spacing="-1.8">Hey, I'm Hisham.</text>
    <text x="63" y="169" fill="#c5d2df" font-size="20">Curious about how things work. Driven to make them work better.</text>
    <text x="63" y="218" fill="#72e2bf" font-size="15">observe <tspan fill="#91b5ff">/</tspan> question <tspan fill="#91b5ff">/</tspan> build <tspan fill="#91b5ff">/</tspan> improve</text>
    <rect x="416" y="204" width="9" height="19" rx="1" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M62 244H938" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
  <path d="M62 244H938" stroke="#ffffff" stroke-opacity=".5" stroke-width="1" stroke-dasharray="65 900">
    <animate attributeName="stroke-dashoffset" values="965;0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>