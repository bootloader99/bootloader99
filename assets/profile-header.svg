<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="Hisham — engineer and independent builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1727"/>
      <stop offset="1" stop-color="#172d35"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73dfc0"/>
      <stop offset="1" stop-color="#8aaeff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#dcecff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="250" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="250" rx="18" fill="url(#grid)"/>
  <circle cx="865" cy="70" r="145" fill="#73dfc0" opacity=".055"/>
  <circle cx="955" cy="230" r="110" fill="#8aaeff" opacity=".055"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="53" fill="#91a8bb" font-size="14">INDEPENDENTLY CURIOUS / ALWAYS BUILDING</text>
    <text x="60" y="121" fill="#f4f7fb" font-size="49" font-weight="700" letter-spacing="-1.5">Hey, I'm Hisham.</text>
    <text x="63" y="163" fill="#c2d0dc" font-size="20">I turn ideas and problems into useful software.</text>
    <text x="63" y="207" fill="#73dfc0" font-size="15">understand <tspan fill="#8aaeff">→</tspan> explore <tspan fill="#8aaeff">→</tspan> build <tspan fill="#8aaeff">→</tspan> refine</text>
    <rect x="432" y="193" width="9" height="18" rx="1" fill="url(#line)">
      <animate attributeName="opacity" values="1;0;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M62 229H938" stroke="url(#line)" stroke-opacity=".65" stroke-width="2"/>
</svg>