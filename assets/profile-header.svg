<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-label="Hisham — curious engineer, building with intent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset=".58" stop-color="#142635"/>
      <stop offset="1" stop-color="#17352f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#72e2bf"/>
      <stop offset="1" stop-color="#91b5ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#72e2bf" stop-opacity=".22"/>
      <stop offset="1" stop-color="#72e2bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#dcecff" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
  <rect width="1000" height="270" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="270" rx="18" fill="url(#grid)"/>
  <circle cx="855" cy="90" r="190" fill="url(#glow)">
    <animate attributeName="opacity" values=".55;.95;.55" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".24">
    <circle cx="860" cy="112" r="88" stroke-dasharray="2 9"/>
    <circle cx="860" cy="112" r="116" stroke-dasharray="1 13">
      <animateTransform attributeName="transform" type="rotate" from="0 860 112" to="360 860 112" dur="55s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="860" cy="24" r="4" fill="#72e2bf">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- A tiny Android tinkers with a floating interface node -->
  <g>
    <!-- The interface wakes up when the Android reaches toward it -->
    <g fill="none" stroke="#72e2bf" stroke-width="1.5">
      <path d="M895 91H920V70H937" stroke-opacity=".55" stroke-dasharray="3 4"/>
      <circle cx="939" cy="70" r="5" fill="#72e2bf" fill-opacity=".15">
        <animate attributeName="r" values="4;7;4" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".35;1;.35" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M895 126H921V147H940" stroke-opacity=".35" stroke-dasharray="2 5"/>
      <circle cx="942" cy="147" r="3" fill="#91b5ff" stroke="none"/>
    </g>
    <g transform="translate(858 111)">
      <animateTransform attributeName="transform" type="translate" values="858 111;858 104;858 111" dur="4s" repeatCount="indefinite"/>
      <!-- antennae -->
      <path d="M-11 -22L-17 -31M11 -22L17 -31" fill="none" stroke="#72e2bf" stroke-width="2.6" stroke-linecap="round"/>
      <!-- body -->
      <path d="M-20 -9A20 20 0 0 1 20 -9V-5H-20Z" fill="#72e2bf"/>
      <rect x="-20" y="-6" width="40" height="29" rx="7" fill="#72e2bf"/>
      <!-- eyes -->
      <g fill="#10202a">
        <circle cx="-7" cy="-13" r="2.2"/>
        <circle cx="7" cy="-13" r="2.2"/>
      </g>
      <!-- arms, right arm reaches to tap the glowing node -->
      <path d="M-25 0L-30 13M24 -1L34 -13L43 -13" fill="none" stroke="#72e2bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="d" values="M-25 0L-30 13M24 -1L34 -13L43 -13;M-25 0L-30 13M24 -1L35 -18L45 -18;M-25 0L-30 13M24 -1L34 -13L43 -13" dur="3.6s" repeatCount="indefinite"/>
      </path>
      <path d="M-10 23V31M10 23V31" stroke="#72e2bf" stroke-width="4" stroke-linecap="round"/>
      <!-- small status light -->
      <circle cx="0" cy="9" r="2" fill="#17352f">
        <animate attributeName="fill" values="#17352f;#91b5ff;#17352f" dur="3.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- Tap ripple -->
    <circle cx="903" cy="94" r="3" fill="none" stroke="#91b5ff" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="3;15;3" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <!-- little data packets travel along the circuit -->
    <circle r="2.5" fill="#91b5ff" filter="url(#softGlow)">
      <animateMotion path="M895 91H920V70H937" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2" fill="#72e2bf">
      <animateMotion path="M895 126H921V147H940" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="62" y="54" fill="#9bb0c2" font-size="13" letter-spacing="2">A MINDSET, NOT A STACK</text>
    <text x="60" y="126" fill="#f4f7fb" font-size="51" font-weight="700" letter-spacing="-1.8">Hey, I'm Hisham.</text>
    <text x="63" y="169" fill="#c5d2df" font-size="20">Curious about how things work. Driven to make them work better.</text>
    <text x="63" y="218" fill="#72e2bf" font-size="15">observe <tspan fill="#91b5ff">/</tspan> question <tspan fill="#91b5ff">/</tspan> build <tspan fill="#91b5ff">/</tspan> improve</text>
    <rect x="416" y="204" width="9" height="19" rx="1" fill="url(#accent)">
      <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M62 244H938" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
  <path d="M62 244H938" stroke="#ffffff" stroke-opacity=".5" stroke-width="1" stroke-dasharray="65 900">
    <animate attributeName="stroke-dashoffset" values="965;0" dur="8s" repeatCount="indefinite"/>
  </path>
</svg>